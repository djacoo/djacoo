<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" role="img" aria-label="djacoo — artificial intelligence · machine learning · bioinformatics">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace; }
      .ink  { fill: #1A140E; }
      .gold { fill: #8A6F4A; }
      .amb  { fill: #C49868; }
    </style>

    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E9D6"/>
      <stop offset="1" stop-color="#E7DBBE"/>
    </linearGradient>

    <!-- amber phosphor sweep for the prompt -->
    <linearGradient id="phosphor" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#1A140E"><animate attributeName="offset" values="-0.5;0.4;1.5" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="0.08" stop-color="#C49868"><animate attributeName="offset" values="-0.42;0.48;1.58" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="0.16" stop-color="#1A140E"><animate attributeName="offset" values="-0.34;0.56;1.66" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>

    <!-- CRT screen vignette -->
    <radialGradient id="vig" cx="50%" cy="48%" r="72%">
      <stop offset="0.5"  stop-color="#1A140E" stop-opacity="0"/>
      <stop offset="1"    stop-color="#1A140E" stop-opacity="0.34"/>
    </radialGradient>

    <!-- refresh roll band -->
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#C49868" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C49868" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#C49868" stop-opacity="0"/>
    </linearGradient>

    <!-- scanlines -->
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#1A140E" opacity="0.06"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <!-- hexdump column clip -->
    <clipPath id="clipL"><rect x="44" y="176" width="320" height="234"/></clipPath>
    <clipPath id="clipR"><rect x="1192" y="416" width="320" height="234"/></clipPath>
  </defs>

  <!-- warm paper screen -->
  <rect width="1600" height="820" fill="url(#paper)"/>


  <!-- ===================== DRAGON (line-art watermark) ===================== -->
  <!-- official Kali dragon (vector, recolored gold) — phosphor watermark -->
  <g transform="translate(644 300) scale(13)" fill="#8A6F4A" opacity="0.34">
    <animate attributeName="opacity" values="0.28;0.42;0.28" dur="6s" repeatCount="indefinite"/>
    <path d="M12.778 5.943s-1.97-.13-5.327.92c-3.42 1.07-5.36 2.587-5.36 2.587s5.098-2.847 10.852-3.008zm7.351 3.095l.257-.017s-1.468-1.78-4.278-2.648c1.58.642 2.954 1.493 4.021 2.665zm.42.74c.039-.068.166.217.263.337.004.024.01.039-.045.027-.005-.025-.013-.032-.013-.032s-.135-.08-.177-.137c-.041-.057-.049-.157-.028-.195zm3.448 8.479s.312-3.578-5.31-4.403a18.277 18.277 0 0 0-2.524-.187c-4.506.06-4.67-5.197-1.275-5.462 1.407-.116 3.087.643 4.73 1.408-.007.204.002.385.136.552.134.168.648.35.813.445.164.094.691.43 1.014.85.07-.131.654-.512.654-.512s-.14.003-.465-.119c-.326-.122-.713-.49-.722-.511-.01-.022-.015-.055.06-.07.059-.049-.072-.207-.13-.265-.058-.058-.445-.716-.454-.73-.009-.016-.012-.031-.04-.05-.085-.027-.46.04-.46.04s-.575-.283-.774-.893c.003.107-.099.224 0 .469-.3-.127-.558-.344-.762-.88-.12.305 0 .499 0 .499s-.707-.198-.82-.85c-.124.293 0 .469 0 .469s-1.153-.602-3.069-.61c-1.283-.118-1.55-2.374-1.43-2.754 0 0-1.85-.975-5.493-1.406-3.642-.43-6.628-.065-6.628-.065s6.45-.31 11.617 1.783c.176.785.704 2.094.989 2.723-.815.563-1.733 1.092-1.876 2.97-.143 1.878 1.472 3.53 3.474 3.58 1.9.102 3.214.116 4.806.942 1.52.84 2.766 3.4 2.89 5.703.132-1.709-.509-5.383-3.5-6.498 4.181.732 4.549 3.832 4.549 3.832zM12.68 5.663l-.15-.485s-2.484-.441-5.822-.204C3.37 5.211 0 6.38 0 6.38s6.896-1.735 12.68-.717Z"/>
  </g>

  <!-- ===================== HEXDUMP STREAMS ===================== -->
  <!-- bytes spell: djacoo / AI ML / BIOINF / MMXXVI / 45.44N / 10.99E / EDITIO / N 01/ -->
  <g class="mono gold" font-size="12.5" letter-spacing="1" opacity="0.20">
    <g clip-path="url(#clipL)">
      <g>
        <text x="56" y="190">0x00  64 6A 61 63 6F 6F  djacoo</text>
        <text x="56" y="216">0x08  41 49 2E 4D 4C 2E   AI.ML.</text>
        <text x="56" y="242">0x10  42 49 4F 49 4E 46  BIOINF</text>
        <text x="56" y="268">0x18  4D 4D 58 58 56 49  MMXXVI</text>
        <text x="56" y="294">0x20  34 35 2E 34 34 4E  45.44N</text>
        <text x="56" y="320">0x28  31 30 2E 39 39 45  10.99E</text>
        <text x="56" y="346">0x30  45 44 49 54 49 4F  EDITIO</text>
        <text x="56" y="372">0x38  4E 20 30 31 2F E2  N 01/.</text>
        <text x="56" y="398">0x00  64 6A 61 63 6F 6F  djacoo</text>
        <text x="56" y="424">0x08  41 49 2E 4D 4C 2E   AI.ML.</text>
        <text x="56" y="450">0x10  42 49 4F 49 4E 46  BIOINF</text>
        <text x="56" y="476">0x18  4D 4D 58 58 56 49  MMXXVI</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -208" dur="18s" repeatCount="indefinite"/>
      </g>
    </g>
    <g clip-path="url(#clipR)">
      <g>
        <text x="1204" y="430">0x40  34 35 2E 34 34 4E  45.44N</text>
        <text x="1204" y="456">0x48  31 30 2E 39 39 45  10.99E</text>
        <text x="1204" y="482">0x50  49 20 2D 2D 20 49  I -- I</text>
        <text x="1204" y="508">0x58  45 44 20 30 31 2F  ED 01/</text>
        <text x="1204" y="534">0x60  E2 88 9E 20 4E 30  ..  N0</text>
        <text x="1204" y="560">0x68  64 6A 61 63 6F 6F  djacoo</text>
        <text x="1204" y="586">0x70  41 49 20 4D 4C 20   AI ML</text>
        <text x="1204" y="612">0x78  42 49 4F 49 4E 46  BIOINF</text>
        <text x="1204" y="638">0x40  34 35 2E 34 34 4E  45.44N</text>
        <text x="1204" y="664">0x48  31 30 2E 39 39 45  10.99E</text>
        <text x="1204" y="690">0x50  49 20 2D 2D 20 49  I -- I</text>
        <text x="1204" y="716">0x58  45 44 20 30 31 2F  ED 01/</text>
        <animateTransform attributeName="transform" type="translate" values="0 -208;0 0" dur="22s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- radar ping rings behind prompt -->
  <g transform="translate(800 440)" fill="none" stroke="#8A6F4A" stroke-width="0.9">
    <circle r="20"><animate attributeName="r" values="20;220" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle r="20"><animate attributeName="r" values="20;220" dur="6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle r="20"><animate attributeName="r" values="20;220" dur="6s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="6s" begin="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===================== TERMINAL WINDOW CHROME ===================== -->
  <rect x="34" y="32" width="1532" height="756" rx="12" fill="none" stroke="#1A140E" stroke-width="1.3" opacity="0.5"/>
  <!-- title bar divider -->
  <line x1="34" y1="94" x2="1566" y2="94" stroke="#1A140E" stroke-width="1" opacity="0.4" stroke-dasharray="1532" stroke-dashoffset="1532">
    <animate attributeName="stroke-dashoffset" values="1532;0;0;0;0;-1532" dur="20s" repeatCount="indefinite"/>
  </line>
  <!-- window controls -->
  <g>
    <circle cx="66"  cy="63" r="6.5" fill="#8A6F4A"><animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="90"  cy="63" r="6.5" fill="#C49868"><animate attributeName="opacity" values="0.5;1;0.5" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="114" cy="63" r="6.5" fill="#B89268"><animate attributeName="opacity" values="0.5;1;0.5" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="800"  y="68" class="mono ink" font-size="12" letter-spacing="3" text-anchor="middle" opacity="0.8">N° 001 &#x2002;&#x00B7;&#x2002; DJACOO<animate attributeName="opacity" values="0.5;0.95;0.5" dur="7s" repeatCount="indefinite"/></text>
  <text x="1536" y="68" class="mono ink" font-size="12" letter-spacing="3" text-anchor="end" opacity="0.8">MMXXVI<animate attributeName="opacity" values="0.5;0.95;0.5" dur="7s" begin="2s" repeatCount="indefinite"/></text>

  <!-- ===================== KALI PROMPT (wordmark) ===================== -->
  <g class="mono" filter="url(#soft)" opacity="0.25">
    <text x="464" y="440" font-size="56" font-weight="700" fill="#8A6F4A">┌──(djacoo@kali)-[~]</text>
  </g>
  <text x="464" y="440" class="mono" font-size="56">
    <tspan fill="#8A6F4A" font-weight="700">┌──(</tspan><tspan fill="url(#phosphor)" font-weight="700">djacoo</tspan><tspan fill="#8A6F4A" font-weight="700">@</tspan><tspan fill="#C49868" font-weight="700">kali</tspan><tspan fill="#8A6F4A" font-weight="700">)-[</tspan><tspan class="ink" font-weight="700">~</tspan><tspan fill="#8A6F4A" font-weight="700">]</tspan>
  </text>
  <text x="464" y="512" class="mono gold" font-size="56" font-weight="700">└─$</text>
  <!-- blinking cursor -->
  <rect x="598" y="476" width="28" height="42" fill="#8A6F4A">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle: motd flush-left under the prompt -->
  <text x="468" y="600" class="mono ink" font-size="13" letter-spacing="4" opacity="0.7">ARTIFICIAL INTELLIGENCE &#x2002;&#x00B7;&#x2002; MACHINE LEARNING &#x2002;&#x00B7;&#x2002; BIOINFORMATICS<animate attributeName="opacity" values="0.35;0.85;0.35" dur="10s" repeatCount="indefinite"/></text>

  <!-- ===================== STATUS BAR ===================== -->
  <line x1="34" y1="738" x2="1566" y2="738" stroke="#1A140E" stroke-width="1" opacity="0.4" stroke-dasharray="1532" stroke-dashoffset="1532">
    <animate attributeName="stroke-dashoffset" values="1532;0;0;0;0;-1532" dur="20s" begin="3s" repeatCount="indefinite"/>
  </line>
  <text x="64"   y="766" class="mono ink" font-size="11" letter-spacing="2.5">LAT 45.44&#xB0;N &#x2002;&#x00B7;&#x2002; LON 10.99&#xB0;E<animate attributeName="opacity" values="0.4;1;0.4" dur="10s" repeatCount="indefinite"/></text>
  <text x="800"  y="766" class="mono ink" font-size="10" letter-spacing="2" text-anchor="middle" opacity="0.6">EDITION 01 &#x2044; &#x221E;<animate attributeName="opacity" values="0.25;0.8;0.25" dur="12s" begin="2s" repeatCount="indefinite"/></text>
  <text x="1536" y="766" class="mono ink" font-size="11" letter-spacing="2.5" text-anchor="end">I &#x2002;&#x2014;&#x2002; I<animate attributeName="opacity" values="0.4;1;0.4" dur="10s" begin="3s" repeatCount="indefinite"/></text>

  <!-- ===================== CRT OVERLAYS (top z) ===================== -->
  <!-- horizontal scan sweep -->
  <line x1="-100" y1="430" x2="-100" y2="560" stroke="#C49868" stroke-width="1" opacity="0">
    <animate attributeName="x1" values="-100;1700" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-100;1700" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0.45;0" dur="16s" repeatCount="indefinite"/>
  </line>
  <!-- refresh roll -->
  <rect x="0" width="1600" height="150" fill="url(#roll)">
    <animate attributeName="y" values="-150;820" dur="7s" repeatCount="indefinite"/>
  </rect>
  <!-- scanlines + flicker -->
  <rect width="1600" height="820" fill="url(#scan)">
    <animate attributeName="opacity" values="0.9;1;0.85;1" dur="0.18s" repeatCount="indefinite"/>
  </rect>
  <!-- vignette / screen curvature -->
  <rect width="1600" height="820" fill="url(#vig)"/>
</svg>
